# The probe directory, kept for reference. See spike/AGENTS.md: this is
# one-time-use, and code that graduates into the product moves out of here with
# its tests. It is a workspace member so `just check` runs the tests of the
# probes that are still here, rather than leaving them to rot unrun.
[project]
name = "temper-spike"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temper-core", "jarvislabs>=0.2.17"]

[tool.uv.sources]
temper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
