# Reserved by ADR-0010 so that issue #51 had a name to move orchestration
# into rather than inventing one. Now the process that claims queued jobs
# and drives them through the unchanged orchestrator (ADR-0066).
[project]
name = "temper-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["temper-core", "temper-control-plane"]

[tool.uv.sources]
temper-core = { workspace = true }
temper-control-plane = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_worker"]
