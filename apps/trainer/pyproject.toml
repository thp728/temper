# This package declares no dependencies and never will.
#
# The image is FROM a digest-pinned Axolotl base that already carries the
# resolved torch, transformers, peft, trl and bitsandbytes matrix. Installing
# anything reintroduces the version problem that pinned base exists to avoid:
# spike 3 lost checkpoint-resume to four packages moving independently.
#
# This file exists so pytest can find tests/, and for no other reason.
[project]
name = "temper-trainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
