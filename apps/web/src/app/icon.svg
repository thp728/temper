<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="1.5 1.5 21 21">
  <!--
    The favicon form of the brand delta (Boxicons `delta-filled`, MIT,
    https://boxicons.com). Same path as the TemperMark component. Three
    changes for a 16px tab: the viewBox is tightened onto the ink so the
    delta fills the box (the default 24-unit frame leaves empty bands top
    and bottom), a thin stroke adds weight to the legs so the hollow
    triangle does not close up under 16px anti-aliasing, and the root
    carries explicit width/height, because a bare viewBox has no intrinsic
    size and some renderers require one before they will accept an SVG as
    a favicon. The fill is the brand lavender, explicit because a favicon
    has no `currentColor` to inherit, and it is the one hue legible on
    both a light and a dark tab.
  -->
  <path d="m3,21h18c.35,0,.68-.18.86-.48.18-.3.19-.67.03-.98L12.88,2.53c-.35-.66-1.42-.66-1.77,0L2.12,19.53c-.16.31-.15.68.03.98.18.3.51.48.86.48Zm7.99-13.95l6.32,11.95H4.66l6.32-11.95Z" fill="#5e6ad2" stroke="#5e6ad2" stroke-width="1" stroke-linejoin="round"/>
</svg>
