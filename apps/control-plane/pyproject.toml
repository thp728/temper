# The control plane. Accepts datasets and jobs, drives machines, records what
# happened, holds every artifact.
[project]
name = "temper-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temper-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "jarvislabs>=0.2.17",
    # The object-store backend of the storage seam speaks the S3 API, which is
    # also what MinIO -- the Phase B store -- serves.
    "boto3>=1.35",
    # The tokenizer a dataset's token count is produced with (issue #42). The
    # core counting pass takes a plain `dict -> int` seam, so the dependency
    # lives here, beside the other things that touch Hugging Face, not in
    # `temper_core`'s zero-dependency package.
    "tokenizers>=0.21",
]

[tool.uv.sources]
temper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_control_plane"]
