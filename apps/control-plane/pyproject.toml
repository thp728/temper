# The control plane. Accepts datasets and jobs, drives machines, records what
# happened, holds every artifact.
[project]
name = "temper-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temper-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "jarvislabs>=0.2.17",
    # The object-store backend of the storage seam speaks the S3 API, which is
    # also what MinIO -- the Phase B store -- serves.
    "boto3>=1.35",
    # The tokenizer a dataset's token count is produced with (issue #42). The
    # core counting pass takes a plain `dict -> int` seam, so the dependency
    # lives here, beside the other things that touch Hugging Face, not in
    # `temper_core`'s zero-dependency package.
    "tokenizers>=0.21",
    # The relational store (issue #43). The binary build vendors libpq so a
    # fresh clone needs no system Postgres client library. Pool is required,
    # not optional: measured at 63 separate connections for one orchestrator
    # test before pooling landed (db.py's own comment explains why).
    "psycopg[binary,pool]>=3.2",
    # Structured logs with a correlation identifier threaded through
    # contextvars (spec 008 / issue #52): JSON, machine-readable, every line
    # carrying the request's identifier through the job and the machine.
    "structlog>=24.1",
    # Parquet is how Hugging Face publishes a dataset in bulk, and reading it
    # is what replaced paginating the viewer's preview endpoint (ADR-0073).
    # Not available transitively -- checked before adding it. pyarrow is the
    # reference implementation and the one HF's own conversion writes with,
    # and its `iter_batches` reader is what keeps an import's memory bounded
    # by a batch rather than a file. It lands here, beside the other things
    # that touch Hugging Face, and not in `temper_core`, which stays free of
    # dependencies. It is a large wheel (~40 MB); one import path is a thin
    # reason for that, and reading Parquet correctly by hand is not a thing
    # anyone should do.
    "pyarrow>=17",
    # Error reporting is wired as an integration point with no credential set
    # locally -- present in shape, inert in effect (issue #52). The SDK is
    # installed and init is called, but without a DSN it does nothing.
    "sentry-sdk>=2.0",
]

[tool.uv.sources]
temper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temper_control_plane"]
