# One command starts every service the product needs (issue #29).
#
#     docker compose up          (or `just up`)
#
# Four services: PostgreSQL (issue #43's relational store), the control
# plane (the API), the worker (issue #51's separate process that claims
# ``queued`` jobs with ``SELECT ... FOR UPDATE SKIP LOCKED`` and drives
# them), and the web shell. The worker was empty by design (ADR-0010
# reserves it for orchestration) and joins this file now that it ships.
#
# **The mode.** The stack defaults to the zero-cost tier
# (TEMPER_FAKE_PROVIDER=1, the in-package fake provider): a reviewer with no
# account and no secrets can walk the whole journey -- upload, validate, plan,
# watch a run complete, download the artifact -- for free. This is spec 012's
# second front door. Real compute is one switch away: flip the single
# `x-zero-cost-mode` anchor near the top of this file to "0" (all three
# services read it, so the web shell's demonstration marking and the backend's
# provider move together) and put JL_API_KEY in `.env` (mounted below,
# optional). Nothing else differs between the modes.
#
# **Data survives a restart.** PostgreSQL's own data directory and the object
# store live on named volumes: `docker compose down && docker compose up`
# keeps everything. The volumes are project-scoped, so sibling worktrees
# running the same stack on one machine never share them.
#
# **Health.** Each service declares a healthcheck; the control plane waits
# for Postgres to report ready before it starts (issue #43: a relational
# store replaces the local SQLite file, so there is now a real dependency to
# wait on rather than a file that is simply there or not), and the web waits
# for the control plane to report every dependency ready in turn. The control
# plane's own /health reports the database and the object store separately,
# so a broken dependency is distinguishable from a broken application.
#
# Ports default to this issue's range (5780 web / 5781 backend) and are
# overridable with TEMPER_WEB_PORT / TEMPER_BACKEND_PORT -- the same variables
# playwright.config.ts reads when the e2e journeys boot their own halves, so a
# local run and a journey can be pointed at the same ports without editing
# code.

# The control plane's address on the compose network, defined once here and
# read by both the web image's build (which bakes the /v1 rewrite target into
# the routes manifest) and its runtime (server-side fetches read it directly).
x-backend-url: &backend-url http://control-plane:8000

# The mode, defined once and read by every service that needs it (ADR-0010,
# ADR-0067): "1" is the zero-cost tier -- the reviewer-facing default -- and
# "0" the real tier. Flipping to real compute is changing this one line, and
# all three services move together: the web shell's demonstration marking
# cannot outlive the provider it describes, because both read this same value.
x-zero-cost-mode: &zero-cost-mode "1"

services:
  # The relational store (issue #43). Its own healthcheck is what
  # `depends_on: condition: service_healthy` below waits on -- the control
  # plane must never start against a database that is still initializing,
  # which `pg_isready` is the documented way to ask.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temper
      POSTGRES_PASSWORD: temper
      POSTGRES_DB: temper
    volumes:
      - temper-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temper -d temper"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    environment:
      TEMPER_FAKE_PROVIDER: *zero-cost-mode
      # The compose network's own hostname for the service above, not
      # localhost: config.py's zero-configuration default points at
      # localhost:5432 for a bare local run (`just db-up`), which is not
      # reachable from inside this container.
      TEMPER_DATABASE_URL: postgresql://temper:temper@postgres:5432/temper
    # An optional .env at the repo root supplies JL_API_KEY (and any TEMPER_*
    # override) for real compute; nothing is required for the zero-cost tier.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TEMPER_BACKEND_PORT:-5781}:8000"
    volumes:
      - temper-objects:/data
    healthcheck:
      # 200 means every dependency is ready; a broken database or object
      # store answers 503 (urllib raises), so the container is reported
      # unhealthy exactly when /health says a dependency is down.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    # The package, not the submodule: `python -m temper_worker` runs
    # `__main__.py`, which calls `worker.main()`. `python -m
    # temper_worker.worker` runs worker.py as `__main__` with no
    # `if __name__ == "__main__"` guard in that file -- it imports the
    # module, defines the functions, and exits 0 having done nothing. Found
    # by the e2e journeys leaving every launched job `queued` forever; no
    # unit test calls this command line.
    command: ["python", "-m", "temper_worker"]
    environment:
      TEMPER_FAKE_PROVIDER: *zero-cost-mode
      TEMPER_DATABASE_URL: postgresql://temper:temper@postgres:5432/temper
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    volumes:
      - temper-objects:/data
    restart: unless-stopped
    healthcheck:
      # `python:3.12-slim` carries no `ps` (no procps package), so a
      # process-table check isn't available; `db.ping()` checks the
      # dependency that actually matters -- a worker that cannot reach the
      # database cannot claim anything, which is a truer liveness signal
      # than "a process with this name exists" would be anyway.
      test:
        - CMD
        - python
        - -c
        - "from temper_control_plane import db; db.ping()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        TEMPER_BACKEND_URL: *backend-url
    environment:
      TEMPER_BACKEND_URL: *backend-url
      # The same single mode setting the control plane and the worker read
      # (ADR-0071): the shell reads it to mark every page as a demonstration,
      # so the marking is driven by the one switch and cannot be turned off
      # while that switch is set. All three services read the same compose
      # anchor, so the banner and the provider cannot disagree.
      TEMPER_FAKE_PROVIDER: *zero-cost-mode
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${TEMPER_WEB_PORT:-5780}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  temper-postgres:
  temper-objects:
